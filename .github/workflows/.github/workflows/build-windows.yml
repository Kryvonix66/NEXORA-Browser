
name: Build NEXORA for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout NEXORA
        uses: actions/checkout@v4

      - name: Find project folder
        shell: pwsh
        run: |
          if (Test-Path "package.json") {
            $project = "."
          } elseif (Test-Path "nexora-browser/package.json") {
            $project = "nexora-browser"
          } else {
            throw "Could not find NEXORA package.json"
          }
          "PROJECT_DIR=$project" >> $env:GITHUB_ENV

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build NEXORA EXE
        run: npx electron-builder --win nsis portable
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload EXE files
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-Windows
          path: ${{ env.PROJECT_DIR }}/dist/*.exe
          if-no-files-found: error
